<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Lenis Linktree</title>

    <!-- Sicherheits-Header (aktualisiert: font-src hinzugefügt) -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; 
                   style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; 
                   font-src https://cdnjs.cloudflare.com; 
                   img-src 'self' data: https:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Canvas für Glühwürmchen (Hintergrund) -->
    <canvas id="fireflyCanvas"></canvas>

    <!-- Dark Mode Toggle -->
    <button id="theme-toggle" aria-label="Theme umschalten">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Hauptcontainer -->
    <main class="container">

        <!-- Profil -->
        <div class="profile">
            <img src="profil picture.jpg" alt="Leni" class="profile-img" />
            <h1 class="name">Leni</h1>
        </div>

        <!-- Link-Buttons -->
        <div class="link-grid">
            <a href="https://github.com/Leni-HUB" target="_blank" rel="noopener noreferrer" class="link-btn github">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://www.instagram.com/leni01729/" target="_blank" rel="noopener noreferrer" class="link-btn instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://mywishlists.de/wishs/view/00n2D5NEQMNQYm3Hum5xoi2D" target="_blank" rel="noopener noreferrer" class="link-btn wishlist">
                <i class="fas fa-gift"></i> Wunschliste
            </a>
            <a href="https://pronouns.page/@Leni45_Solid" target="_blank" rel="noopener noreferrer" class="link-btn pronouns">
                <i class="fas fa-user-tag"></i> Pronomen
            </a>
            <a href="http://leni-hub.github.io/Quarz/" target="_blank" rel="noopener noreferrer" class="link-btn notes">
                <i class="fas fa-sticky-note"></i> Quarz Notes
            </a>
        </div>

        <!-- Footer mit HRT-Info -->
        <footer class="footer">
            <p>
                <i class="fas fa-heart" style="color: #c47a4a;"></i>
                Seit <span id="hrt-date">01.01.2023</span> auf HRT
                <span id="hrt-duration" style="font-weight:500;">–</span>
            </p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
